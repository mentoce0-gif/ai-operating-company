name: Deploy AI Operating Company to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "mvp/website/index.html"
      - "mvp/website/styles.css"
      - "mvp/website/app.js"
      - "mvp/website/sample-data.json"
      - "mvp/website/public/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: mvp/website

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
